# NetTwin AI — PNETLab real-topology fixture (Phase 1, approved 2026-11-15)
#
# Status: INTEGRATED for fixture-based testing (Mode 1). Promoted from
#         proposed/ per Phase-1 approval; provenance and assumptions below
#         are unchanged. Live-collector comparison (G4) is still pending.
# Provenance (evidence classes):
#   [DEVICE]  OSPF neighbor tables captured from R2-3 / R2-1 (user relayed)
#   [USER]    link/IP/loopback inventory, OSPF FULL state, corrected
#             IP-to-interface assignments, CDP-verified cabling, IOS 15.2
#   [GAP]     data NOT supplied by the brief — marked inline, never invented
#   [ASSUMP]  equal-cost paths: engine supports ONE next_hop per route
#             (BASE_LIMITATIONS: "no ECMP") → a representative next hop was
#             chosen where ECMP is likely; confirm actual FIB at G4
#
# Modeling decisions (schema-conformant, see PNETLAB_PREPARATION_REPORT.md §3):
#   * Single VRF "GLOBAL" — the lab runs one flat OSPF table (no VRFs given).
#     Every interface carries vrf_id (the engine's VRF-handoff check requires
#     peer interfaces to share the walk's VRF).
#   * R2 (multilayer switch): L3 view only — Links terminate on the SVIs that
#     carry the /30 addresses (Vlan12/13/23). Known physical access port
#     Ethernet0/2 ∈ VLAN23 is inventoried as an unlinked L2 interface.
#     [GAP] physical access ports for VLAN12/VLAN13 not specified.
#   * Loopbacks are interfaces AND connected /32 routes; loopback endpoints
#     provide deterministic end-to-end test targets.
#   * FortiGate default routes OMITTED: next-hop not supplied [GAP].
#     FortiGate management addresses not supplied [GAP].
#   * OSPF area/process/adjacency state: schema has no field for it [GAP-
#     SCHEMA]; route.protocol="ospf" is the only representable OSPF fact.
#   * No schema-level "version" key: Topology is extra="forbid" [GAP-SCHEMA
#     observation] — provenance lives in this header comment instead.

devices:
  # --- Core Layer 3 switch [USER] ---
  - id: r2
    name: R2
    vendor: cisco
    platform: ios
    metadata:
      role: core-layer3-switch
      mgmt_note: "SVI-based design; Loopback0 is the management anchor [ASSUMP]"

  # --- Cisco IOL routers, IOS 15.2 [USER] ---
  - id: r2-1
    name: R2-1
    vendor: cisco
    platform: ios
    management_address: 10.255.255.1
    metadata:
      role: router
      os: "IOS 15.2 (Cisco IOL)"
      external_gateway: true          # E0/2 -> PNETLab external network

  - id: r2-2
    name: R2-2
    vendor: cisco
    platform: ios
    management_address: 10.255.255.3
    metadata:
      role: router
      os: "IOS 15.2 (Cisco IOL)"

  - id: r2-3
    name: R2-3
    vendor: cisco
    platform: ios
    management_address: 10.255.255.4
    metadata:
      role: router
      os: "IOS 15.2 (Cisco IOL)"

  - id: r2-4
    name: R2-4
    vendor: cisco
    platform: ios
    management_address: 10.255.255.5
    metadata:
      role: router
      os: "IOS 15.2 (Cisco IOL)"

  # --- FortiGate VMs [USER] ---
  - id: fortigate
    name: FortiGate
    vendor: fortinet
    platform: fortios
    # management_address: [GAP] not supplied
    metadata:
      role: firewall
      license_vcpu: 1                 # VM must stay within license [USER]
      license_ram_mb: 2048

  - id: fortigate-1
    name: FortiGate-1
    vendor: fortinet
    platform: fortios
    # management_address: [GAP] not supplied
    metadata:
      role: firewall
      license_vcpu: 1
      license_ram_mb: 2048

vrfs:
  - id: GLOBAL
    name: default
    tenant_id: null                   # single flat routing table [USER]
    description: "Lab-wide OSPF routing table (no VRFs configured in lab)."

