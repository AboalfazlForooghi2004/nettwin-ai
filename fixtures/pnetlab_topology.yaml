links:
  # L3 adjacency view: each Link joins the interfaces that carry the /30.
  # On R2 the carrier is the SVI; the physical path (e.g. Ethernet0/2 in
  # VLAN23) is L2 and does not appear as a Link endpoint.
  - id: lnk-r2-r23
    source_interface_id: r2-vlan23        # R2 E0/2 (VLAN23) <-> R2-3 E0/0 [USER]
    destination_interface_id: r23-e00
    state: up
  - id: lnk-r23-r22
    source_interface_id: r23-e01          # R2-3 E0/1 <-> R2-2 E0/0 [USER]
    destination_interface_id: r22-e00
    state: up
  - id: lnk-r23-r24
    source_interface_id: r23-e02          # R2-3 E0/2 <-> R2-4 E0/0 [USER]
    destination_interface_id: r24-e00
    state: up
  - id: lnk-r24-r21
    source_interface_id: r24-e01          # R2-4 E0/1 <-> R2-1 E0/1 [USER]
    destination_interface_id: r21-e01
    state: up
  - id: lnk-r22-r21
    source_interface_id: r22-e01          # R2-2 E0/1 <-> R2-1 E0/0 [USER]
    destination_interface_id: r21-e00
    state: up
  - id: lnk-r2-fgt
    source_interface_id: r2-vlan12        # R2 VLAN12 SVI <-> FortiGate port2 [USER]
    destination_interface_id: fgt-p2
    state: up
  - id: lnk-r2-fgt1
    source_interface_id: r2-vlan13        # R2 VLAN13 SVI <-> FortiGate-1 port2 [USER]
    destination_interface_id: fgt1-p2
    state: up

