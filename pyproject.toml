[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nettwin-ai"
version = "0.1.0"
description = "Evidence-driven network intelligence and troubleshooting platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "networkx>=3.2",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
# Phase-2 read-only collector (opt-in; core install stays unchanged).
# Rationale: Python has no stdlib SSH client; netmiko is the de-facto
# standard for Cisco IOS (supports cisco_ios / IOS 15.2) and handles
# prompt detection + paging. Install with: pip install -e ".[collect]"
#
# The [par4] extra pins paramiko<5: IOS 15.2 on Cisco IOL only offers the
# legacy SHA-1 KEX algorithms that paramiko 5.x no longer negotiates. Netmiko
# is capped below 5 for the same verified combination (4.8.0 + paramiko 4.0.0).
collect = [
    "netmiko[par4]>=4.8,<5",
]

[project.scripts]
nettwin = "nettwin.main:main"
nettwin-mcp = "nettwin.mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]   # tests must work even without an editable install
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
]
ignore = [
    "E501",  # line length handled by formatter
]
